# Daily refresh: pulls fresh public data, reruns the engine and redeploys the live page.
# Main trigger: Vercel Cron calls /api/refresh four times each afternoon (vercel.json), which starts
# this workflow if the page does not show tomorrow yet. Backup: the GitHub schedule below.
# Can also be run by hand from the Actions tab.
# Needs repository secrets: EIA_API_KEY, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: Daily refresh
on:
  # Backup only. GitHub runs scheduled jobs on a best effort basis: they can start hours late or be
  # dropped. Each run skips itself if the page already shows tomorrow, so whichever trigger fires
  # first wins and the others do nothing.
  schedule:
    - cron: '41 21 * * *'
    - cron: '13 22 * * *'
    - cron: '47 22 * * *'
    - cron: '19 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if the page already shows tomorrow'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if the page already shows tomorrow
        id: fresh
        run: |
          node -e "const r=require('./public/data/report.json');const t=new Date(Date.now()+864e5).toLocaleDateString('en-CA',{timeZone:'America/Denver'});const fresh=r.date>=t;console.log('page shows',r.date,'tomorrow is',t,'fresh',fresh);require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'fresh='+fresh+'\n')"
      - if: steps.fresh.outputs.fresh != 'true' || inputs.force
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.fresh.outputs.fresh != 'true' || inputs.force
        run: npm ci
      - if: steps.fresh.outputs.fresh != 'true' || inputs.force
        name: Pull data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          echo "EIA_API_KEY=$EIA_API_KEY" > .env.local
          node scripts/ingest.mjs
          node scripts/pull-prices.mjs
          rm -f .env.local
      - if: steps.fresh.outputs.fresh != 'true' || inputs.force
        name: Run engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm test
          npm run capacity
          npm run station
          npm run engine
          npx tsx scripts/explain-ai.ts
          npx tsx scripts/explain-build.ts --lenient --source scripts/explanations.source.json --source scripts/explanations.ai.json
          npx tsx scripts/archive.ts
      - if: steps.fresh.outputs.fresh != 'true' || inputs.force
        name: Check the new forecast is for today or later (else keep the old site)
        run: |
          node -e "const r=require('./public/data/report.json');const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Denver'});console.log('forecast for',r.date,'today',today);if(r.date<today){console.error('stale forecast, not deploying');process.exit(1)}"
      - if: steps.fresh.outputs.fresh != 'true' || inputs.force
        name: Save the new data to the repo
        run: |
          git config user.name "daily-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add public/data scripts/explanations.ai.json
          git diff --cached --quiet || git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this ran: replay the data commit on top, keeping this run's data.
          git pull --rebase -X theirs origin main
          git push
      - if: steps.fresh.outputs.fresh != 'true' || inputs.force
        name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
